[project]
name = "metaclass-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "certifi>=2024.0",
  "fastapi>=0.115",
  "imageio-ffmpeg>=0.6",
  "pillow>=11.0",
  "pydantic-settings>=2.0",
  "pymupdf>=1.25",
  "python-multipart>=0.0.20",
  "python-pptx>=1.0",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.0", "ruff>=0.9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
