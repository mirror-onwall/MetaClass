<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="900" viewBox="0 0 1920 900">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7FAFF"/>
      <stop offset="1" stop-color="#EEF4FC"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7FAF5"/>
      <stop offset="1" stop-color="#EFF5EB"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFCF4"/>
      <stop offset="1" stop-color="#FBF3DE"/>
    </linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAF8FF"/>
      <stop offset="1" stop-color="#F2EEFA"/>
    </linearGradient>
    <linearGradient id="g5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7FAFE"/>
      <stop offset="1" stop-color="#EEF3FA"/>
    </linearGradient>
    <linearGradient id="g6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF9F4"/>
      <stop offset="1" stop-color="#F8EEE5"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#0E326A"/>
    </marker>
    <style>
      .cn { font-family: "Microsoft YaHei UI", "Segoe UI", "PingFang SC", sans-serif; }
      .mono { font-family: "Consolas", "JetBrains Mono", monospace; }
      .card-title { font-size: 22px; font-weight: 500; fill: #171B21; }
      .card-title-sm { font-size: 20px; font-weight: 500; fill: #171B21; }
      .detail { font-size: 16px; font-weight: 400; fill: #344459; }
      .detail-sm { font-size: 14px; font-weight: 400; fill: #506178; }
      .fallback-title { font-size: 22px; font-weight: 500; fill: #253A55; }
      .fallback-text { font-size: 16px; font-weight: 400; fill: #40536C; }
      .output-text { font-size: 16px; font-weight: 500; fill: #222A35; }
      .label { font-size: 15px; font-weight: 400; fill: #486078; }
    </style>
  </defs>

  <rect width="1920" height="900" fill="#FFFFFF"/>

  <!-- Main arrows -->
  <line x1="280" y1="310" x2="314" y2="310" stroke="#0E326A" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="570" y1="310" x2="604" y2="310" stroke="#0E326A" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="860" y1="310" x2="894" y2="310" stroke="#0E326A" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="1150" y1="310" x2="1184" y2="310" stroke="#0E326A" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="1440" y1="310" x2="1474" y2="310" stroke="#0E326A" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Card 1 -->
  <g>
    <rect x="40" y="70" width="240" height="490" rx="20" fill="url(#g1)" stroke="#244F87" stroke-width="2"/>
    <g transform="translate(120 125)" fill="none" stroke="#315E96" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 0 H55 L80 25 V92 H0 Z"/>
      <path d="M55 0 V25 H80"/>
      <line x1="18" y1="46" x2="61" y2="46"/>
      <line x1="18" y1="63" x2="61" y2="63"/>
      <line x1="18" y1="80" x2="48" y2="80"/>
    </g>
    <text x="160" y="300" text-anchor="middle" class="cn card-title">1. PresentationPlan</text>
    <text x="160" y="334" text-anchor="middle" class="cn card-title">数据结构设计</text>
    <text x="160" y="390" text-anchor="middle" class="cn detail">source_section_ids</text>
    <text x="160" y="420" text-anchor="middle" class="cn detail">covered_content_ids</text>
    <text x="160" y="450" text-anchor="middle" class="cn detail">title + key_points</text>
    <text x="160" y="480" text-anchor="middle" class="cn detail">speaker_script</text>
    <text x="160" y="510" text-anchor="middle" class="cn detail">suggested_visual</text>
  </g>

  <!-- Card 2 -->
  <g>
    <rect x="330" y="70" width="240" height="490" rx="20" fill="url(#g2)" stroke="#607A4F" stroke-width="2"/>
    <g transform="translate(395 130)" fill="none" stroke="#5E794E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="110" height="76" rx="7"/>
      <path d="M42 22 L24 38 L42 54"/>
      <path d="M68 22 L86 38 L68 54"/>
      <line x1="58" y1="18" x2="51" y2="58"/>
      <line x1="25" y1="94" x2="85" y2="94"/>
      <line x1="55" y1="76" x2="55" y2="94"/>
    </g>
    <text x="450" y="300" text-anchor="middle" class="cn card-title-sm">2. LearningContent</text>
    <text x="450" y="334" text-anchor="middle" class="cn card-title">知识内容扩充</text>
    <text x="450" y="390" text-anchor="middle" class="cn detail">分配 content ID</text>
    <text x="450" y="420" text-anchor="middle" class="cn detail">概念 / 方法 / 公式</text>
    <text x="450" y="450" text-anchor="middle" class="cn detail">按知识类型扩充</text>
    <text x="450" y="480" text-anchor="middle" class="cn detail">小批次受控并发</text>
    <text x="450" y="510" text-anchor="middle" class="cn detail">失败重试与兜底</text>
  </g>

  <!-- Card 3 -->
  <g>
    <rect x="620" y="70" width="240" height="490" rx="20" fill="url(#g3)" stroke="#B18430" stroke-width="2"/>
    <g transform="translate(680 126)" fill="none" stroke="#E0A922" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="120" height="86" rx="7"/>
      <line x1="18" y1="22" x2="102" y2="22"/>
      <rect x="18" y="39" width="34" height="29" rx="3"/>
      <line x1="66" y1="42" x2="102" y2="42"/>
      <line x1="66" y1="55" x2="102" y2="55"/>
      <line x1="66" y1="68" x2="92" y2="68"/>
      <line x1="60" y1="86" x2="60" y2="108"/>
      <path d="M42 108 H78"/>
    </g>
    <text x="740" y="300" text-anchor="middle" class="cn card-title">3. 页面拆分与</text>
    <text x="740" y="334" text-anchor="middle" class="cn card-title">教学内容规划</text>
    <text x="740" y="390" text-anchor="middle" class="cn detail">按知识密度动态拆页</text>
    <text x="740" y="420" text-anchor="middle" class="cn detail">生成 title + key_points</text>
    <text x="740" y="450" text-anchor="middle" class="cn detail">生成 speaker_script</text>
    <text x="740" y="480" text-anchor="middle" class="cn detail">容量与覆盖校验</text>
    <text x="740" y="510" text-anchor="middle" class="cn detail">形成 PresentationPlan</text>
  </g>

  <!-- Card 4 -->
  <g>
    <rect x="910" y="70" width="240" height="490" rx="20" fill="url(#g4)" stroke="#60439A" stroke-width="2"/>
    <g transform="translate(965 118)" fill="none" stroke="#65439C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M58 7 C39 -4 22 8 25 27 C7 29 2 49 16 61 C4 77 17 96 35 91 C42 107 60 105 65 91 V20 C65 13 62 9 58 7 Z"/>
      <path d="M72 7 C91 -4 108 8 105 27 C123 29 128 49 114 61 C126 77 113 96 95 91 C88 107 70 105 65 91 V20 C65 13 68 9 72 7 Z"/>
      <circle cx="36" cy="34" r="5"/>
      <circle cx="28" cy="70" r="5"/>
      <circle cx="47" cy="83" r="5"/>
      <circle cx="94" cy="34" r="5"/>
      <circle cx="102" cy="70" r="5"/>
      <circle cx="83" cy="83" r="5"/>
      <line x1="41" y1="34" x2="65" y2="45"/>
      <line x1="33" y1="70" x2="65" y2="61"/>
      <line x1="47" y1="78" x2="65" y2="70"/>
      <line x1="89" y1="34" x2="65" y2="45"/>
      <line x1="97" y1="70" x2="65" y2="61"/>
      <line x1="83" y1="78" x2="65" y2="70"/>
    </g>
    <text x="1030" y="300" text-anchor="middle" class="cn card-title">4. Codex结构化</text>
    <text x="1030" y="334" text-anchor="middle" class="cn card-title">PPT视觉生成</text>
    <text x="1030" y="390" text-anchor="middle" class="cn detail">CodexPPTProvider</text>
    <text x="1030" y="420" text-anchor="middle" class="cn detail">只读 sandbox</text>
    <text x="1030" y="450" text-anchor="middle" class="cn detail">JSON Schema</text>
    <text x="1030" y="480" text-anchor="middle" class="cn detail">SlideElement</text>
    <text x="1030" y="510" text-anchor="middle" class="cn detail">python-pptx 编译</text>
  </g>

  <!-- Card 5 -->
  <g>
    <rect x="1200" y="70" width="240" height="490" rx="20" fill="url(#g5)" stroke="#355F90" stroke-width="2"/>
    <g transform="translate(1260 126)" fill="none" stroke="#315A8D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="120" height="88" rx="8"/>
      <path d="M19 48 L36 64 L63 33"/>
      <line x1="75" y1="31" x2="102" y2="31"/>
      <line x1="75" y1="49" x2="102" y2="49"/>
      <line x1="75" y1="67" x2="94" y2="67"/>
      <path d="M41 106 H79"/>
      <path d="M60 88 V106"/>
    </g>
    <text x="1320" y="300" text-anchor="middle" class="cn card-title">5. 内容与版式</text>
    <text x="1320" y="334" text-anchor="middle" class="cn card-title">校验及自动修复</text>
    <text x="1320" y="390" text-anchor="middle" class="cn detail">页数与内容精确匹配</text>
    <text x="1320" y="420" text-anchor="middle" class="cn detail">字号 / 边界 / 碰撞</text>
    <text x="1320" y="450" text-anchor="middle" class="cn detail">校验错误反馈Codex</text>
    <text x="1320" y="480" text-anchor="middle" class="cn detail">重新生成并再次检查</text>
    <text x="1320" y="510" text-anchor="middle" class="cn detail">渲染逐页PNG预览</text>
  </g>

  <!-- Final output panel -->
  <g>
    <rect x="1490" y="45" width="390" height="535" rx="24" fill="url(#g6)" stroke="#92745A" stroke-width="2"/>
    <text x="1685" y="98" text-anchor="middle" class="cn card-title">最终PPT与教学资源</text>

    <g>
      <rect x="1520" y="130" width="330" height="88" rx="13" fill="#FFFFFF" stroke="#9FB0C5" stroke-width="1.5"/>
      <g transform="translate(1544 151)" fill="none" stroke="#315E96" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M0 0 H30 L43 13 V48 H0 Z"/>
        <path d="M30 0 V13 H43"/>
      </g>
      <text x="1610" y="174" class="mono output-text">deck.pptx</text>
      <text x="1610" y="198" class="cn detail-sm">可编辑PPTX</text>
    </g>

    <g>
      <rect x="1520" y="237" width="330" height="88" rx="13" fill="#FFFFFF" stroke="#9FB0C5" stroke-width="1.5"/>
      <g transform="translate(1542 259)" fill="none" stroke="#C89B27" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <rect x="0" y="0" width="48" height="40" rx="4"/>
        <circle cx="14" cy="12" r="4"/>
        <path d="M6 34 L18 23 L27 31 L36 19 L43 34"/>
      </g>
      <text x="1610" y="281" class="cn output-text">逐页 PNG</text>
      <text x="1610" y="305" class="cn detail-sm">前端课件预览</text>
    </g>

    <g>
      <rect x="1520" y="344" width="330" height="88" rx="13" fill="#FFFFFF" stroke="#9FB0C5" stroke-width="1.5"/>
      <g transform="translate(1544 365)" fill="none" stroke="#5F7D4F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 5 Q22 -4 40 5 V43 Q22 34 4 43 Z"/>
        <path d="M40 5 Q58 -4 76 5 V43 Q58 34 40 43 Z"/>
        <line x1="40" y1="5" x2="40" y2="43"/>
      </g>
      <text x="1640" y="386" class="mono output-text" font-size="14">speaker_scripts.json</text>
      <text x="1640" y="410" class="cn detail-sm">逐页教师讲稿</text>
    </g>

    <g>
      <rect x="1520" y="451" width="330" height="88" rx="13" fill="#FFFFFF" stroke="#9FB0C5" stroke-width="1.5"/>
      <g transform="translate(1545 474)" fill="none" stroke="#675093" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="15" cy="15" r="12"/>
        <circle cx="52" cy="15" r="12"/>
        <path d="M0 48 Q15 29 30 48"/>
        <path d="M37 48 Q52 29 67 48"/>
      </g>
      <text x="1630" y="496" class="cn output-text">QuestionBank</text>
      <text x="1630" y="520" class="cn detail-sm">ClassroomPlan</text>
    </g>
  </g>

  <!-- Codex repair loop -->
  <path d="M1320 560 V620 H1030 V560" fill="none" stroke="#0E326A" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
  <text x="1175" y="613" text-anchor="middle" class="cn label">校验失败：返回错误并自动修复</text>

  <!-- Presenton fallback -->
  <path d="M1390 560 V675" fill="none" stroke="#0E326A" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
  <g>
    <rect x="1015" y="690" width="670" height="120" rx="18" fill="#F6F8FB" stroke="#3F5E84" stroke-width="2"/>
    <g transform="translate(1048 721)" fill="none" stroke="#3F5E84" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 14 H49"/>
      <path d="M36 2 L49 14 L36 26"/>
      <path d="M49 42 H3"/>
      <path d="M16 30 L3 42 L16 54"/>
    </g>
    <text x="1125" y="731" class="cn fallback-title">6. Presenton备用生成机制</text>
    <text x="1125" y="767" class="cn fallback-text">Codex 修复失败　→　切换 Presenton</text>
    <text x="1125" y="794" class="cn fallback-text">锁定原始文字　→　重新校验</text>
    <rect x="1435" y="735" width="220" height="52" rx="11" fill="#FFFFFF" stroke="#A8B5C5"/>
    <text x="1545" y="767" text-anchor="middle" class="cn output-text">内容锁定版 PPTX</text>
  </g>
  <path d="M1685 690 V600 H1715 V580" fill="none" stroke="#0E326A" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/>

  <!-- Downstream note -->
  <g>
    <rect x="40" y="840" width="1840" height="40" rx="12" fill="#F2F5F9" stroke="#C8D2DF"/>
    <text x="960" y="866" text-anchor="middle" class="cn label">LearningContent → PresentationPlan → 可编辑PPTX → QuestionBank → ClassroomPlan → 多智能体互动课堂</text>
  </g>
</svg>
