<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="topLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B4F9C"/>
      <stop offset="1" stop-color="#2C78D2"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EEF5FD"/>
      <stop offset="1" stop-color="#D9EAFB"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#173A5F" flood-opacity="0.12"/>
    </filter>
    <style>
      .cn { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      .title { font-size: 50px; font-weight: 800; fill: #0A4F9E; }
      .subtitle { font-size: 21px; font-weight: 500; fill: #60758B; }
      .card-title { font-size: 28px; font-weight: 750; fill: #173B61; }
      .card-kicker { font-size: 16px; font-weight: 700; letter-spacing: 1px; fill: #2C6DB2; }
      .body { font-size: 18px; font-weight: 500; fill: #334E68; }
      .number { font-size: 22px; font-weight: 800; fill: #FFFFFF; }
      .shot-label { font-size: 15px; font-weight: 700; fill: #5D7792; }
      .flow-title { font-size: 21px; font-weight: 800; fill: #154E89; }
      .flow-item { font-size: 18px; font-weight: 700; fill: #294F75; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#F8FAFD"/>

